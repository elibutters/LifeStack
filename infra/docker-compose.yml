# Local development database only. Production uses a hosted Postgres (see README).
name: lifestack

services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: lifestack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifestack
      POSTGRES_PASSWORD: lifestack
      POSTGRES_DB: lifestack
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifestack -d lifestack"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

name: lifestack

x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  image: lifestack-app
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    APP_TZ: ${APP_TZ:-UTC}

services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: lifestack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: pnpm --filter @lifestack/db migrate
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: pnpm --filter @lifestack/web start
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  workers:
    <<: *app
    command: pnpm --filter @lifestack/workers start
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    <<: *app
    command: pnpm --filter @lifestack/mcp start
    environment:
      <<: *app-env
      PORT: "3001"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

name: LifeStack
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LifeStack:
    type: application
    platform: iOS
    sources: [LifeStack]
    dependencies:
      - target: LifeStackWidgets
    entitlements:
      path: LifeStack/LifeStack.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)app.lifestack.shared"]
    info:
      path: LifeStack/Info.plist
      properties:
        CFBundleDisplayName: Life Stack
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        LSBaseURL: $(API_BASE_URL)
        LSKeychainGroup: $(AppIdentifierPrefix)app.lifestack.shared
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Life Stack records the places you visit so your assistant knows where you have been.
        NSLocationAlwaysAndWhenInUseUsageDescription: Choose Always so places and trips are recorded even when the app is closed. Only visits and big moves are recorded, not constant GPS.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only: a portrait-only app cannot also target iPad (all orientations are required there)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LifeStackWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LifeStackWidgets
      - LifeStack/Keychain.swift
      - LifeStack/APIClient.swift
      - LifeStack/Models.swift
      - LifeStack/NextEventAttributes.swift
    entitlements:
      path: LifeStackWidgets/LifeStackWidgets.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)app.lifestack.shared"]
    info:
      path: LifeStackWidgets/Info.plist
      properties:
        CFBundleDisplayName: Life Stack
        LSBaseURL: $(API_BASE_URL)
        LSKeychainGroup: $(AppIdentifierPrefix)app.lifestack.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  LifeStackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LifeStackUITests]
    dependencies:
      - target: LifeStack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LifeStack:
    build:
      targets:
        LifeStack: all
    test:
      targets: [LifeStackUITests]

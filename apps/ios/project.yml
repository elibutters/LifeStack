name: LifeStack
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LifeStack:
    type: application
    platform: iOS
    sources: [LifeStack]
    info:
      path: LifeStack/Info.plist
      properties:
        CFBundleDisplayName: Life Stack
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        LSBaseURL: $(API_BASE_URL)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only: a portrait-only app cannot also target iPad (all orientations are required there)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LifeStackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LifeStackUITests]
    dependencies:
      - target: LifeStack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LifeStack:
    build:
      targets:
        LifeStack: all
    test:
      targets: [LifeStackUITests]
